<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — HoneytrapAI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
      justify-content: center;
    }

    .logo-icon { font-size: 1.6rem; }

    .logo-text {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f0c040;
      letter-spacing: 0.02em;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #888;
      text-align: center;
      margin-bottom: 1.8rem;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    input[type="password"] {
      width: 100%;
      background: #1a1a28;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      color: #e0e0e0;
      padding: 0.65rem 0.85rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus {
      border-color: #f0c040;
    }

    .btn {
      width: 100%;
      background: #f0c040;
      color: #0a0a0f;
      border: none;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }

    .btn:hover { background: #f5d060; }

    .error {
      background: rgba(231, 76, 60, 0.12);
      border: 1px solid rgba(231, 76, 60, 0.4);
      border-radius: 6px;
      color: #e74c3c;
      padding: 0.65rem 0.85rem;
      font-size: 0.85rem;
      margin-bottom: 1.1rem;
    }

    .hint {
      font-size: 0.75rem;
      color: #555;
      text-align: center;
      margin-top: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">🐝</span>
      <span class="logo-text">HoneytrapAI</span>
    </div>

    <h1>Set Your Password</h1>
    <p class="subtitle">
      For your security, please set a new dashboard password<br>before continuing.
    </p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/change-password">
      <div class="field">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password"
               placeholder="Minimum 8 characters" autofocus required>
      </div>
      <div class="field">
        <label for="confirm">Confirm New Password</label>
        <input type="password" id="confirm" name="confirm"
               placeholder="Repeat new password" required>
      </div>
      <button type="submit" class="btn">Set Password &amp; Continue</button>
    </form>

    <p class="hint">v{{ version }}</p>
  </div>
</body>
</html>
